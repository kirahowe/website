<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
<!-- The site mark: a lowercase "k." in Dancing Script Bold (SIL OFL),
     picked to echo the brush-script wordmark in the header.

     Two deliberate departures from plain typeset text, both in service of
     16px: the glyph is stroked in its own fill colour (~1.6 viewBox units)
     because Dancing Script's Bold is a display cut and goes to mush that
     small, and the full stop is scaled 1.4x about its own centre because
     at true size it renders barely over a pixel and vanishes.

     Ground and ink are the light theme's accent / on-accent pair —
     the site's own filled-control colours. It has to be this teal rather
     than the dark theme's lighter #64d1dd, because white on that one
     measures 1.8:1 and washes out; on #00778c it is 5.2:1. Fixed colours
     rather than theme-switching, so the one opaque asset serves both
     themes and holds up against tab chrome of any colour.

     The scale's negative Y flips CoreText's y-up outline into SVG's
     y-down space. -->
  <title>k.</title>
  <rect width="64" height="64" rx="14" fill="#00778c"/>
