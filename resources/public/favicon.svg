<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
<!-- The site mark: the entry-type legend as a 3x2 grid of dots, one per
     type. Top row: post, quote, link; bottom row: release, tool, note.
     The order keeps the two greens and the two purples from ever sitting
     adjacent, so six hues stay six hues at tab size.

     Colours are the dark-theme cuts on the dark canvas (#17171a): the
     icon is a literal swatch of the site in the theme it leads with. The
     light-theme cuts are darkened to clear AA on paper and go muddy on
     charcoal, so they stay out of the tile. Fixed colours rather than
     theme-switching, as before: one opaque asset serves both themes and
     holds up against tab chrome of any colour.

     Geometry: r 6.5 dots on a 15-by-15.5-unit pitch; the cluster spans
     about two thirds of the tile so the dots survive 16px. Corner
     radius 14, same as the previous mark. -->
  <title>six dots</title>
  <rect width="64" height="64" rx="14" fill="#17171a"/>
  <circle cx="17" cy="24.25" r="6.5" fill="#cd9ce9"/>
  <circle cx="32" cy="24.25" r="6.5" fill="#8fdf9a"/>
  <circle cx="47" cy="24.25" r="6.5" fill="#e79f4e"/>
  <circle cx="17" cy="39.75" r="6.5" fill="#ff7cb8"/>
  <circle cx="32" cy="39.75" r="6.5" fill="#a5a8f5"/>
  <circle cx="47" cy="39.75" r="6.5" fill="#c9d367"/>
</svg>
