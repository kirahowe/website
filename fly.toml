# Fly.io config. Site behavior lives in config.edn. Cloudflare homepage
# purging is enabled by CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN secrets.
# Before first deploy:
#   1. change `app` to your (globally unique) app name
#   2. fly deploy
app = "kirahowe-website"
primary_region = "yyz"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
